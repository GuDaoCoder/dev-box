name: Release artifacts

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows with WebView2
            os: windows-latest
            artifact: Windows-WebView2
          - name: macOS without WebView2
            os: macos-latest
            artifact: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - run: pnpm tauri build
      - name: Read application version
        id: version
        shell: bash
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: devbox-${{ steps.version.outputs.version }}-${{ matrix.artifact }}-${{ runner.arch }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
