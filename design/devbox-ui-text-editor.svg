<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">DevBox 轻量文本编辑器界面设计</title>
  <desc id="desc">深色主题桌面界面，左侧是 DevBox 功能导航，工作区内左侧是项目文件树，右侧是多文件标签、查找替换栏和带语法高亮的 YAML 编辑器。</desc>
  <style>
    .ui { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
    .text { fill: #e8edf2; }
    .muted { fill: #8b98a7; }
    .dim { fill: #657382; }
    .accent { fill: #43c6e8; }
    .tiny { font-size: 12px; }
    .small { font-size: 13px; }
    .body { font-size: 14px; }
    .label { font-size: 15px; font-weight: 600; }
    .code { font-size: 16px; }
    .line { stroke: #263241; stroke-width: 1; }
    .icon { fill: none; stroke: #8b98a7; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-bright { fill: none; stroke: #e8edf2; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>

